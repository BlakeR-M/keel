# Tool policy: Example Gym. Loaded by keel.agent.policy.Policy.from_yaml; the appliance reads it from
# <data_dir>/policy.yaml (copy it there at install, see runbook.md).
#
# Every tool call the model proposes passes through this policy before it runs. A tool outside
# allowed_tools is refused and logged. Write tools wait in the approval queue for a person.

allowed_tools:
  - search_docs        # retrieval under the asking user's ACL tags
  - calculator         # arithmetic only (class capacity, pro-rata fees)
  - sql_readonly       # SELECT-only, table allowlist below; inert until a reporting database is attached
  - create_ticket      # write tool: queued for the owner to approve, never run unattended

write_tools_require_approval: true

tool_arg_rules:
  sql_readonly:
    # Aggregate reporting views only. Per-member rows stay out of the reporting export.
    tables: [class_timetable, attendance_summary]
    max_rows: 50
  http_get:
    # http_get is off the allowlist for the pilot (air-gapped). Should it ever be switched on, an empty
    # host list refuses every host until a specific one is named here.
    hosts: []

max_tool_calls_per_request: 6
