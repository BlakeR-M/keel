# Ingest manifest TEMPLATE: Example Nannying Agency.
#
# This file holds placeholders. No client document lives in this repository. On the client's machine:
#   1. Copy this file to C:\Keel\example-agency\corpus.manifest.yaml (next to a corpus\ folder).
#   2. Put the documents under corpus\<class>\ and replace each example path with the real file name
#      (one entry per file; a class with five files gets five entries with the same acl_tags).
#   3. Remove entries you have no file for: ingest stops at the first missing path.
#   4. .venv\Scripts\python.exe -m keel.cli ingest --manifest C:\Keel\example-agency\corpus.manifest.yaml
# Relative paths resolve against this file's directory. Ingest is idempotent: rerunning adds nothing.
#
# acl_tags follow keel.yaml roles: a user must carry at least one of a document's tags to retrieve it.
# Tag each document with the narrowest role that should read it; wider roles carry that tag too.
# `class` is kept as document metadata for the admin page.

documents:
  # --- public: material families may also see -----------------------------------------------
  - path: corpus/public/service-guide.pdf
    title: Service Guide for Families
    acl_tags: [public]
    class: family-facing

  - path: corpus/public/family-faq.md
    title: Family FAQ
    acl_tags: [public]
    class: family-facing

  # --- staff: every staff member -----------------------------------------------------------
  - path: corpus/policies/child-safety-policy.pdf
    title: Child Safety Policy
    acl_tags: [staff]
    class: policy

  - path: corpus/policies/code-of-conduct.pdf
    title: Code of Conduct
    acl_tags: [staff]
    class: policy

  - path: corpus/policies/work-health-and-safety.docx
    title: Work Health and Safety Policy
    acl_tags: [staff]
    class: policy

  - path: corpus/policies/privacy-policy.pdf
    title: Privacy Policy
    acl_tags: [staff]
    class: policy

  # --- carer: handbook and onboarding ---------------------------------------------------------
  - path: corpus/carers/carer-handbook.pdf
    title: Carer Handbook
    acl_tags: [carer]
    class: handbook

  - path: corpus/carers/onboarding-pack.docx
    title: Carer Onboarding Pack
    acl_tags: [carer]
    class: onboarding

  - path: corpus/carers/shift-procedures.md
    title: Shift Procedures
    acl_tags: [carer]
    class: procedure

  # --- coordinator: family agreements and placement procedures --------------------------------
  - path: corpus/coordination/family-agreement-template.docx
    title: Family Agreement (blank template)
    acl_tags: [coordinator]
    class: agreement-template

  - path: corpus/coordination/placement-and-rostering-procedure.docx
    title: Placement and Rostering Procedure
    acl_tags: [coordinator]
    class: procedure

  - path: corpus/coordination/incident-handling.pdf
    title: Incident Handling Procedure
    acl_tags: [coordinator]
    class: procedure

  # --- owner: management ---------------------------------------------------------------------
  - path: corpus/management/insurance-summary.pdf
    title: Insurance Summary
    acl_tags: [owner]
    class: management

  - path: corpus/management/supplier-and-contractor-agreements.docx
    title: Supplier and Contractor Agreements
    acl_tags: [owner]
    class: management
