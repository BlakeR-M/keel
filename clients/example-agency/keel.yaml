# Keel overlay: Example Nannying Agency (nannying agency).
#
# Config only. No document, roster, family, carer or contact detail belongs in this file or anywhere in
# this repository. Real paths and people are filled in on the client's machine (see runbook.md).
#
# Layout is shared with clients/example-gym/keel.yaml so a third client is a copy: client, settings, roles,
# users, files, notes.

client:
  id: example-agency
  name: Example Nannying Agency
  kind: nannying agency
  location: Canberra
  approver_role: owner        # who decides approval-queue items and reads the admin page

# Each key maps to the KEEL_ environment variable of the same name in upper case (KEEL_PROFILE,
# KEEL_DATA_DIR, ...). The runbook sets them before deploy/onprem/run.ps1 starts the stack.
settings:
  profile: local
  data_dir: C:\Keel\example-agency\data
  airgap: 1
  local_llm_base_url: http://127.0.0.1:8081/v1
  local_llm_model: qwen2.5-3b-instruct
  local_embed_model: BAAI/bge-small-en-v1.5
  local_rerank_model: Xenova/ms-marco-MiniLM-L-6-v2
  rerank: true
  min_relevance: 0.15
  host: 127.0.0.1
  port: 8400

# ACL tags in this overlay:
#   public       material families may also see (service guide, family FAQ)
#   staff        every staff member: policies, code of conduct, WHS
#   carer        carer handbook, onboarding pack, shift procedures
#   coordinator  family agreements, placement and rostering procedures, incident handling
#   owner        insurance, contracts, finance, management notes
# A role carries every tag listed for it; a chunk is readable when the user holds one of the chunk's tags.
roles:
  owner: [public, staff, carer, coordinator, owner]
  coordinator: [public, staff, carer, coordinator]
  carer: [public, staff, carer]

# Pilot users. Ids are placeholders by design; the runbook explains how to replace them with the
# client's own ids on their machine. Roles are the part that matters.
users:
  - user_id: owner
    role: owner
  - user_id: coordinator-1
    role: coordinator
  - user_id: coordinator-2
    role: coordinator
  - user_id: carer-1
    role: carer
  - user_id: carer-2
    role: carer

# Sibling files, relative to this directory.
files:
  policy: policy.yaml                  # copied to <data_dir>/policy.yaml at install
  manifest: corpus.manifest.yaml       # template; filled in on the client's machine
  runbook: runbook.md
  checklist: needs-from-client.md

notes:
  - The pilot runs air-gapped on one machine at the agency; nothing leaves the box.
  - Family agreements carry personal details and are tagged coordinator, never staff or public.
  - Write tools (create_ticket) wait in the approval queue for the owner.
